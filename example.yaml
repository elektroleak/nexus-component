esphome:
  name: rf433-receiver

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG   # auf INFO reduzieren wenn alles läuft

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# External Component einbinden
external_components:
  - source: github://dein-github-user/esphome-rf6036b   # <-- nach Veröffentlichung anpassen
    components: [rf6036b]

# Remote Receiver – bleibt vollständig erhalten für andere RF-Geräte
# dump: all gibt weiterhin alle empfangenen Codes im Log aus
remote_receiver:
  id: rf_receiver
  pin:
    number: GPIO27          # <-- an deinen Empfänger-Pin anpassen
    inverted: false
  dump: all                 # für Tests; auf "raw" oder ganz entfernen wenn nicht mehr nötig
  tolerance: 50%
  filter: 100us
  idle: 4500us              # muss > längster Sync-Puls (~3950µs) sein

# RF6036B Component: verknüpft sich mit dem remote_receiver oben
rf6036b:
  id: nexus_receiver
  receiver_id: rf_receiver  # Referenz auf den remote_receiver oben

# Sensoren – ein Block pro Kanal, beliebig viele
sensor:
  # Kanal 1 – Außensensor
  - platform: rf6036b
    rf6036b_id: nexus_receiver
    channel: 1
    temperature:
      name: "Außen Temperatur"
    humidity:
      name: "Außen Luftfeuchte"

  # Kanal 2 – Keller (auskommentiert, einkommentieren wenn ein zweiter Sensor vorhanden)
  # - platform: rf6036b
  #   rf6036b_id: nexus_receiver
  #   channel: 2
  #   temperature:
  #     name: "Keller Temperatur"
  #   humidity:
  #     name: "Keller Luftfeuchte"
